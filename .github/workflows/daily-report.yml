name: گزارش روزانه رصد بازار صندوق‌ها

on:
  schedule:
    - cron: "30 6 * * *"   # هر روز ساعت ۱۰:۰۰ به وقت تهران (۰۶:۳۰ UTC)
  workflow_dispatch: {}      # اجرای دستی از تب Actions

permissions:
  contents: write

concurrency:
  group: fund-monitor
  cancel-in-progress: false

jobs:
  # ۱) دریافت داده از فیپیران. فیپیران به آی‌پی خارج از ایران جواب نمی‌دهد، پس این مرحله باید روی
  #    رانر داخل ایران اجرا شود: متغیر FETCH_RUNNER را برابر «self-hosted» (یا برچسب رانر) بگذارید.
  fetch:
    runs-on: ${{ vars.FETCH_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: دریافت داده فیپیران
        env:
          FIPIRAN_PROXY: ${{ secrets.FIPIRAN_PROXY }}
        run: |
          python -m pip install --quiet requests
          python -m monitor.main --stage fetch --raw raw.json.gz
      - uses: actions/upload-artifact@v5
        with:
          name: fipiran-raw
          path: raw.json.gz
          retention-days: 7

  # ۲) تحلیل، ساخت نمودارها و ارسال تلگرام روی سرور گیت‌هاب (تلگرام از آن‌جا در دسترس است)
  report:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: نصب پیش‌نیازها
        run: |
          sudo apt-get update -y && sudo apt-get install -y libraqm0 libfribidi0 libharfbuzz0b || true
          python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v5
        with:
          name: fipiran-raw
      - name: تحلیل و ارسال گزارش تلگرام
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m monitor.main --stage report --raw raw.json.gz
      - name: ذخیره پایگاه داده
        if: always()
        run: |
          git config user.name "fund-monitor-bot"
          git config user.email "fund-monitor-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: report-${{ github.run_number }}
          path: out/
          retention-days: 14

  # ۳) اگر دریافت داده شکست خورد، در تلگرام خبر بده
  alert:
    needs: fetch
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: هشدار تلگرام
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ موتور رصد بازار: امروز دریافت داده از فیپیران انجام نشد. رانر داخل ایران روشن و وصل است؟ (Settings › Actions › Runners)" > /dev/null
